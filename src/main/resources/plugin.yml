name: SalorMurder
version: ${project.version}
main: com.wolfdrache.salormurder.SalorMurder
api-version: 1.19
description: A underwater murder plugin for Minecraft 1.19.3
author: Wolfdrache
depend: [Vault, MurderKnifes, Party]

permissions:
  salormurder.smadmin.map:
    description: Allows the player to manage maps for salormurder.
    default: false
  salormurder.smadmin.round:
    description: Allows the player to manage rounds for salormurder.
    default: false